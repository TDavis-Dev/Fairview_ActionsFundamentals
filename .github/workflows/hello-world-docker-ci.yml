name: CI Build Process for Docker Actions
on:
  push:
    branches: [ main ]
    paths: [ 'hello-world-docker-action/**' ]
  workflow_dispatch:

jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run my own container action
        id: hello-action
        uses: ./hello-world-docker-action
        with:
          who-to-greet: 'Tina'

      - name: Output time set in the container
        run: echo "The time set in the container is ${{ steps.hello-action.outputs.time }}"